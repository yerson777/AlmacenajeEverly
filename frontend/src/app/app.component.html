<nav class="sticky top-0 z-40 bg-gradient-to-r from-primary-800 via-primary-700 to-primary-600 shadow-md">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-3 py-3">
      <a routerLink="/dashboard" (click)="cerrarMenu()" class="flex min-w-0 items-center gap-2 text-white">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-white/95 to-white/80 p-1 shadow-sm ring-1 ring-white/40 sm:h-12 sm:w-12">
          <img src="everly.png" alt="Everly" class="h-full w-full object-contain" />
        </span>
        <span class="truncate text-lg font-bold tracking-wide">Almacenaje</span>
        <span class="hidden rounded-full bg-white/25 px-2.5 py-0.5 text-xs font-medium ring-1 ring-white/40 sm:inline-block">EVERLY</span>
      </a>

      <div class="hidden items-center gap-1 md:flex">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" (click)="cerrarMenu()" class="nav-link">{{ item.label }}</a>
        }
      </div>

      <button
        type="button"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-white transition-colors hover:bg-white/15 md:hidden"
        (click)="menuAbierto = !menuAbierto"
        [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
      >
        <i class="bi text-2xl" [class.bi-list]="!menuAbierto" [class.bi-x-lg]="menuAbierto"></i>
      </button>
    </div>

    @if (menuAbierto) {
      <div class="flex flex-col gap-1 border-t border-white/15 py-3 md:hidden">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="cerrarMenu()"
            class="nav-link w-full"
          >{{ item.label }}</a>
        }
      </div>
    }
  </div>
</nav>

<div class="mx-auto max-w-7xl px-4 py-6 pb-12 sm:px-6 lg:px-8">
  <router-outlet />
</div>
